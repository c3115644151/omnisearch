apply plugin: 'net.neoforged.moddev'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // jarJar embeds these into the published mod JAR (jar-in-jar) so the runtime classes
    // are present when the mod is installed standalone. Without this, jsoup/webp-imageio
    // only exist on the dev classpath (additionalRuntimeClasspath) and the published JAR
    // fails at runtime with ClassNotFoundException (org/jsoup/Jsoup).
    jarJar 'org.jsoup:jsoup:1.19.1'
    jarJar 'org.sejda.imageio:webp-imageio:0.1.6'
    // Keep dev-run-time deps available for runClient (they're also picked up via jarJar's
    // resolution, but additionalRuntimeClasspath guarantees they're on the dev classpath).
    add 'additionalRuntimeClasspath', 'org.jsoup:jsoup:1.19.1'
    add 'additionalRuntimeClasspath', 'org.sejda.imageio:webp-imageio:0.1.6'
}

neoForge.ideSyncTask tasks.named('generateModMetadata')
